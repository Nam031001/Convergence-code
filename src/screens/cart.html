<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>맥도날드 키오스크</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/item-detail.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body class="cart-page">
  <header class="cart-header">
    <img class="cart-header__logo" src="../../asset/logo.png" alt="맥도날드 로고" data-i18n-alt="logoAlt">
    <div class="cart-header__title" data-i18n="orderSummaryTitle">주문 확인</div>
  </header>

  <div class="cart-list" id="cart-list"></div>

  <div class="bottom">
    <a class="menu-pager__arrow" id="cart-pager-prev" aria-label="이전 페이지" data-i18n-aria="prevMenuPage">‹</a>
    <div class="menu-pager__dots" id="cart-pager-dots"></div>
    <a class="menu-pager__arrow" id="cart-pager-next" aria-label="다음 페이지" data-i18n-aria="nextMenuPage">›</a>
  </div>

  <div class="cart-summary">
    <span class="cart-summary__label" data-i18n="totalLabel">합계</span>
    <span class="cart-summary__total" id="cart-summary-total">0원</span>
  </div>
  

  <footer class="step-actions">
    <a class="step-actions__prev" href="menu.html" data-i18n="cancel">취소</a>
    <a class="step-actions__confirm" id="btn-complete" href="payment.html" data-i18n="orderCompleteBtn">주문완료</a>
  </footer>

  <!--
    수량이 1개인 상태에서 "-"를 누르면 바로 지우지 않고 이 확인 팝업을 띄운다.
    빠른 담기 팝업(.quick-add-modal)과 같은 틀을 재사용해서 배경/카드 스타일을 새로 안 만든다.
  -->
  <div class="quick-add-modal" id="confirm-remove-modal" hidden>
    <div class="quick-add-modal__card">
      <p class="quick-add-modal__name" id="confirm-remove-message" data-i18n="confirmRemove">삭제하시겠습니까?</p>
      <div class="quick-add-modal__actions">
        <button class="step-actions__prev" type="button" id="confirm-remove-cancel" data-i18n="cancel">취소</button>
        <button class="step-actions__confirm" type="button" id="confirm-remove-ok" data-i18n="confirm">확인</button>
      </div>
    </div>
  </div>

  <script src="../js/kiosk-guard.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/kiosk-state.js"></script>
  <script src="../js/cart-page.js"></script>
</body>
</html>
