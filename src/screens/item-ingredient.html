<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>맥도날드 키오스크</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/item-detail.css">
</head>
<body class="solo-screen">
  <div class="review-content">
    <header class="review-header">
      <div>
        <h1 class="review-header__title" id="ingredient-title" data-i18n="ingredientTitle">재료 추가/변경</h1>
        <p class="review-header__price" id="ingredient-subtitle"></p>
      </div>
    </header>

    <div class="review-scroll">
      <div class="ingredient-list" id="ingredient-list"></div>
    </div>

    <footer class="step-actions">
      <a class="step-actions__prev" id="btn-cancel" data-i18n="cancel">취소</a>
      <a class="step-actions__confirm" id="btn-confirm" data-i18n="confirm">확인</a>
    </footer>
  </div>

  <script src="../js/kiosk-guard.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/kiosk-state.js"></script>
  <script src="../js/item-ingredient-page.js"></script>
</body>
</html>
