<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>웩도날드 키오스크</title>
    <link rel="stylesheet" href="src/css/common.css" />
    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <img class="top-bar__logo" src="asset/logo.png" alt="웩도날드 로고" data-i18n-alt="logoAlt" />
        <!-- <button class="lang-btn" type="button" id="lang-toggle">ENG</button> -->
      </header>

      <main class="promo">
        <img
          class="promo__banner"
          src="asset/banner.png"
          alt="더블 웩스파이시 상하이 버거 - 버거의 맛과 크기를 더블로 높였다!"
          data-i18n-alt="bannerAlt" />
      </main>

      <footer class="order-type">
        <a class="order-btn" href="./src/screens/menu.html?orderType=dine-in">
          <img class="order-btn__icon" src="asset/icon/storefront.png" alt="" aria-hidden="true" />
          <span data-i18n="dineIn">매장</span>
        </a>
        <a class="order-btn" href="./src/screens/menu.html?orderType=takeout">
          <img class="order-btn__icon" src="asset/icon/takeout_dining.png" alt="" aria-hidden="true" />
          <span data-i18n="takeout">포장</span>
        </a>
      </footer>
    </div>

    <script src="src/js/kiosk-guard.js"></script>
    <script src="src/js/kiosk-state.js"></script>
    <script src="src/js/main.js"></script>
  </body>
</html>
